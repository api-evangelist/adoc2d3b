note: >-
  There is no API and therefore no API pricing. The company's public pricing surface is commercial,
  not developer-facing: the hospital-partner page (https://www.adoc.co.kr/hospital) offers a free
  start ("무료로 시작하기") and routes everything else to two contact forms — 도입 문의하기 for
  hospitals and 제휴 문의하기(기업) for employers — stating that terms depend on hospital size and
  examinee volume. Consumer health-checkup package prices are published on checkup.adoc.co.kr, but
  those are medical service prices, not plans for a machine-readable API, and are deliberately not
  recorded here as API plans.
